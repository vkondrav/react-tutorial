name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Cache node_modules
        id: cache-node-modules
        uses: actions/cache@v4
        with:
          path: playground/node_modules
          key: node-modules-${{ runner.os }}-${{ hashFiles('playground/package-lock.json') }}

      - name: Install dependencies
        if: steps.cache-node-modules.outputs.cache-hit != 'true'
        run: npm ci
        working-directory: playground

      - name: Build
        run: npm run build
        working-directory: playground

  format:
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Restore node_modules cache
        uses: actions/cache/restore@v4
        with:
          path: playground/node_modules
          key: node-modules-${{ runner.os }}-${{ hashFiles('playground/package-lock.json') }}

      - name: Check formatting
        run: npm run format:check
        working-directory: playground

  lint:
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Restore node_modules cache
        uses: actions/cache/restore@v4
        with:
          path: playground/node_modules
          key: node-modules-${{ runner.os }}-${{ hashFiles('playground/package-lock.json') }}

      - name: Check linting
        run: npm run lint:check
        working-directory: playground

  typecheck:
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Restore node_modules cache
        uses: actions/cache/restore@v4
        with:
          path: playground/node_modules
          key: node-modules-${{ runner.os }}-${{ hashFiles('playground/package-lock.json') }}

      - name: Type check
        run: npm run typecheck
        working-directory: playground

  test:
    runs-on: ubuntu-latest
    needs: build
    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2, 3, 4]
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Restore node_modules cache
        uses: actions/cache/restore@v4
        with:
          path: playground/node_modules
          key: node-modules-${{ runner.os }}-${{ hashFiles('playground/package-lock.json') }}

      - name: Install Playwright browsers
        run: npx playwright install --with-deps chromium
        working-directory: playground

      - name: Run tests (shard ${{ matrix.shard }}/4)
        run: npx vitest --project=storybook --run --shard=${{ matrix.shard }}/4
        working-directory: playground
