name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  format:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'
          cache-dependency-path: playground/package-lock.json

      - name: Install dependencies
        run: npm ci
        working-directory: playground

      - name: Check formatting
        run: npm run format:check
        working-directory: playground

  lint:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'
          cache-dependency-path: playground/package-lock.json

      - name: Install dependencies
        run: npm ci
        working-directory: playground

      - name: Check linting
        run: npm run lint:check
        working-directory: playground

  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2, 3, 4]
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'
          cache-dependency-path: playground/package-lock.json

      - name: Install dependencies
        run: npm ci
        working-directory: playground

      - name: Install Playwright browsers
        run: npx playwright install --with-deps chromium
        working-directory: playground

      - name: Run tests (shard ${{ matrix.shard }}/4)
        run: npx vitest --project=storybook --run --shard=${{ matrix.shard }}/4
        working-directory: playground
