name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  format:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'
          cache-dependency-path: playground/package-lock.json

      - name: Install dependencies
        run: npm ci
        working-directory: playground

      - name: Check formatting
        run: npm run format:check
        working-directory: playground

  lint:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'
          cache-dependency-path: playground/package-lock.json

      - name: Install dependencies
        run: npm ci
        working-directory: playground

      - name: Check linting
        run: npm run lint:check
        working-directory: playground

  typecheck:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'
          cache-dependency-path: playground/package-lock.json

      - name: Install dependencies
        run: npm ci
        working-directory: playground

      - name: Type check
        run: npm run typecheck
        working-directory: playground

  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'
          cache-dependency-path: playground/package-lock.json

      - name: Install dependencies
        run: npm ci
        working-directory: playground

      - name: Build
        run: npm run build
        working-directory: playground

  test-and-coverage:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'
          cache-dependency-path: playground/package-lock.json

      - name: Install dependencies
        run: npm ci
        working-directory: playground

      - name: Install Playwright browsers
        run: npx playwright install --with-deps chromium
        working-directory: playground

      - name: Run tests with coverage
        run: npm run test:coverage
        working-directory: playground

      - name: Upload coverage report
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: coverage-report
          path: playground/coverage/
          retention-days: 30
